services:
  - type: web
    name: video-subtitle-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:all
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    # Napomena: besplatan plan ne podržava trajni disk (persistent disk zahteva
    # plaćeni plan). uploads/ i exports/ se brišu na svaki restart/redeploy/spin-down
    # posle 15 min neaktivnosti — isto važi i za listu projekata (drži se u memoriji).
